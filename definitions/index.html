<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лаборатория за дефиниции</title>
<style>
:root {
  color-scheme: light;
  --ink: #13243a;
  --muted: #465c6b;
  --paper: #f1f6f5;
  --white: #ffffff;
  --line: #cededb;
  --navy: #102438;
  --teal: #086253;
  --mint: #b5f2d7;
  --gold: #f8d187;
  --team: #086253;
  --team-pale: #e3f4ec;
  --shadow: 0 10px 24px #16383210;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.46 system-ui, 'Segoe UI', sans-serif; }
button, textarea { font: inherit; }
a { color: inherit; }
button, summary { cursor: pointer; }
:focus-visible { outline: 3px solid #ad5d09; outline-offset: 3px; }
header { background: #fbfdfc; border-bottom: 1px solid var(--line); }
.bar, main, footer { max-width: 1332px; margin: 0 auto; }
.bar { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 32px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); font-size: 1rem; font-weight: 790; text-decoration: none; }
.brand i { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--navy); color: var(--mint); font: 24px/1 Georgia, serif; }
nav, .actions, .chips, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 14px; border-radius: 9px; color: var(--muted); font-weight: 680; text-decoration: none; }
nav a:hover { background: #edf4f1; }
nav a[aria-current="page"] { background: #d9efe5; color: #103e33; }
main { padding: 27px 32px 16px; }
h1, h2, h3, p { margin: 0 0 12px; }
h1, h2 { letter-spacing: -.04em; }
h1 { font-size: clamp(43px, 6.5vw, 89px); line-height: .98; font-weight: 780; }
h2 { font-size: clamp(32px, 4vw, 56px); line-height: 1.05; }
h3 { font-size: clamp(22px, 2.3vw, 30px); line-height: 1.18; letter-spacing: -.02em; }
.eyebrow, .step { display: block; margin: 0 0 9px; font-size: .77rem; font-weight: 820; letter-spacing: .095em; text-transform: uppercase; color: var(--teal); }
.hero { position: relative; overflow: hidden; isolation: isolate; min-height: 368px; display: grid; align-items: center; border-radius: 24px; padding: clamp(29px, 4.4vw, 62px); background: radial-gradient(ellipse at 81% 40%, #214a55, transparent 65%), var(--navy); color: white; }
.hero::before { position: absolute; inset: 0; content: ''; z-index: -1; background: linear-gradient(90deg,#102438 5%,transparent 82%), repeating-linear-gradient(90deg,transparent 0 35px,#c7f2e514 35px 36px), repeating-linear-gradient(0deg,transparent 0 35px,#c7f2e514 35px 36px); }
.hero-copy { max-width: 64%; z-index: 1; }
.hero .eyebrow { color: var(--mint); }
.hero-copy p { max-width: 41ch; margin: 18px 0 0; color: #e1eeec; font-size: clamp(17px, 1.7vw, 23px); }
.hero-meta { margin-top: 21px; display: flex; gap: 8px; flex-wrap: wrap; }
.hero-meta span { border: 1px solid #769b9a; border-radius: 30px; padding: 4px 11px; color: #ecfaf6; font-size: .82rem; font-weight: 700; }
.hero-art { position: absolute; width: min(39%,475px); right: 2%; top: 8%; height: 84%; }
.grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; margin-top: 16px; }
.card, .panel { border: 1px solid var(--line); border-radius: 17px; padding: clamp(16px,2.1vw,26px); background: var(--white); box-shadow: var(--shadow); }
.card { border-top: 3px solid var(--team); }
.card p, .muted { color: var(--muted); }
.card a { margin-top: 4px; }
.panel { margin: 14px 0; }
[data-team="1"] { --team: #096756; --team-pale: #e2f3ec; }
[data-team="2"] { --team: #484489; --team-pale: #edeafa; }
[data-team="3"] { --team: #9a3751; --team-pale: #fae9ee; }
[data-team="4"] { --team: #8a500b; --team-pale: #f8edd9; }
[data-team="5"] { --team: #225a88; --team-pale: #e5eff8; }
.team-grid { grid-template-columns: repeat(5,minmax(0,1fr)); }
.team-grid .card { padding: 19px 16px; }
.team-number, .mode-icon { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 14px; border-radius: 13px; background: var(--team-pale); color: var(--team); font-size: 1.37rem; font-weight: 850; }
.mode-icon svg { width: 27px; height: 27px; }
.team-shell .eyebrow, .team-grid .eyebrow { color: var(--team); }
.team-shell .quote { border-color: var(--team); background: var(--team-pale); }
.team-shell .chips button[aria-pressed="true"] { background: var(--team); border-color: var(--team); }
.actions { margin-top: 12px; }
.btn, .chips button, .prediction button {
  min-height: 46px;
  border: 1px solid var(--teal);
  border-radius: 9px;
  padding: 8px 14px;
  font-weight: 730;
}
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--teal); color: white; text-decoration: none; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.alt, .chips button, .prediction button { background: white; border-color: #88a5a0; color: var(--ink); }
.btn:disabled, .chips button:disabled { opacity: .57; cursor: default; }
.chips button[aria-pressed="true"], .prediction button[aria-pressed="true"] { background: var(--navy); color: white; border-color: var(--navy); }
.quote { margin: 0 0 13px; padding: 12px 16px; border-left: 4px solid var(--teal); border-radius: 4px 10px 10px 4px; background: #e5f3ed; color: var(--navy); font-size: clamp(21px,2.4vw,33px); font-weight: 750; line-height: 1.22; }
#stage { padding: clamp(15px,1.7vw,23px); }
#stage .step { margin-bottom: 7px; }
#stage > p:not(.step) { margin-bottom: 9px; }
.controls { margin: 8px 0; }
.checkline { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 5px 10px; border: 1px solid #96b0ab; border-radius: 8px; font-weight: 650; }
.checkline:has(input:checked) { background: #deefe7; border-color: #739c8e; }
input[type="checkbox"], input[type="radio"] { flex: none; width: 19px; height: 19px; accent-color: var(--teal); }
.table-wrap { overflow-x: auto; margin-top: 11px; border: 1px solid var(--line); border-radius: 11px; }
table { width: 100%; min-width: 680px; border-collapse: collapse; }
th, td { padding: 6px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
thead th { background: var(--navy); color: white; }
tbody tr:last-child > * { border-bottom: 0; }
tbody .match { background: #e0f2e8; }
tbody .mismatch { background: #ffeed2; }
tbody .mismatch td:last-child { color: #78430d; font-weight: 800; }
.instrument { display: flex; align-items: center; gap: 9px; }
.instrument svg { width: 45px; height: 45px; flex: none; padding: 4px; border-radius: 9px; color: var(--teal); background: #f4f8f6; }
.prediction { display: flex; gap: 6px; }
.prediction button { min-width: 51px; min-height: 44px; padding: 4px 8px; }
.feedback { margin: 11px 0 0; font-weight: 750; }
.small { font-size: .88rem; }
.stack label { display: block; margin: 10px 0; font-weight: 710; }
.stack textarea { display: block; width: 100%; min-height: 59px; margin-top: 4px; padding: 8px 11px; border: 1px solid #839c9c; border-radius: 8px; resize: vertical; background: #fbfdfc; color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; }
.excerpt { margin-bottom: 9px; overflow-wrap: anywhere; white-space: pre-wrap; }
.excerpt dt { color: var(--team); font-weight: 760; }
.excerpt dd { margin: 0 0 9px; }
.quizitem { border: 1px solid var(--line); border-radius: 11px; margin: 12px 0; padding: 9px 13px; }
.quizitem legend { padding: 0 6px; font-weight: 750; }
.quizitem label { display: flex; align-items: center; min-height: 44px; margin: 4px 0; padding: 5px 8px; border-radius: 7px; gap: 8px; }
.quizitem label:has(input:checked) { background: #dcefe6; }
.project-options { list-style: none; padding: 0; display: grid; gap: 8px; }
.project-options li { padding: 9px 12px; border-radius: 8px; background: #e7f3ee; font-size: clamp(18px,2.4vw,28px); }
.correct { color: #065647; }
.incorrect { color: #8d2a24; }
details { margin-top: 9px; }
details > *:last-child { margin-bottom: 0; }
summary { padding: 7px 0; color: var(--teal); font-weight: 780; }
.reveal div { padding: 10px 13px; border-radius: 8px; background: #fff0d5; }
footer { padding: 7px 32px 20px; color: var(--muted); font-size: .86rem; }
@media (max-width: 1060px) { .team-grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
@media (max-width: 720px) {
  .bar { flex-wrap: wrap; justify-content: flex-start; }
  .bar, main, footer { padding-right: 15px; padding-left: 15px; }
  nav { gap: 3px; }
  nav a { padding: 5px 9px; }
  main { padding-top: 15px; }
  .grid, .two { grid-template-columns: 1fr; }
  .team-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .hero { min-height: 310px; border-radius: 17px; }
  .hero-copy { max-width: 100%; }
  .hero-art { opacity: .19; width: 69%; right: 0; }
}
@media print { header, footer, .actions, .chips { display: none !important; } body { background: white; } .panel, .card { box-shadow: none; break-inside: avoid; } }
.terms { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; margin: 10px 0; }
.term { margin: 0; padding: 11px 13px; border-radius: 8px; background: #e9f4ee; }
.term:nth-child(2) { background: #e9eefb; }
.term:nth-child(3) { background: #fbefd9; }
.term dt { font-weight: 740; }
.term dd { margin: 2px 0 0; }
.team-shell #team-stage { border-top: 3px solid var(--team); }
@media (max-width: 600px) { .terms { grid-template-columns: 1fr; } }

.room-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;background:var(--navy);color:white;padding:clamp(18px,3vw,36px);border-radius:14px}
.room-banner strong{display:block;font:750 clamp(40px,6vw,76px)/1.1 system-ui;letter-spacing:.09em;font-variant-numeric:tabular-nums}
.room-banner .btn{background:var(--mint);color:var(--navy)}
#invite-note:empty{display:none}#invite-note{max-width:35ch;margin:8px 0 0}
#lobby form{max-width:42rem;margin:12px auto}#lesson-code{border:2px solid #789992;border-radius:9px}
#lobby .team-grid button{display:grid;align-content:start;justify-content:start;text-align:left;gap:4px;padding:16px;border-top:4px solid var(--team)}
#lobby .team-grid strong{font-size:1.2rem}#lobby .team-grid small,#lobby .team-grid span{font-weight:600}
#change-code{margin-top:14px}#room-status{margin:22px 0 10px;font-weight:750}
#room-teams button:disabled{opacity:1;color:#465763;background:#f3f6f5;border-color:#d6e0dd}
#room-teams [data-status=active]:disabled{color:#664300;background:#fff2d7;border-color:#d9b86b}
#room-teams [data-status=done]{background:var(--teal);color:white}
#projection:not(:empty){margin:20px 0;padding:20px;border:1px solid var(--line);border-radius:12px}
#team-stage section.panel{box-shadow:none;background:#eff8f3}#team-stage [role=status]:empty{display:none}
.key-view select,#seat-count{max-width:100%;font:inherit;padding:.5em;border-radius:8px}.key-view .quote{margin-top:1em;font-size:clamp(20px,2vw,30px)}#answer-key{margin-top:1em}

.work-report{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0}
.work-card{min-width:0;padding:clamp(14px,2vw,24px);border:1px solid var(--line);border-top:4px solid #397672;border-radius:12px;background:#fbfdfc}
.work-card:nth-child(2){border-top-color:#655897}
.work-card:last-child{grid-column:1/-1;border-top-color:#a16a2c}
.work-card h4{font-size:1rem;color:var(--muted);margin:0 0 6px}
.work-card .task-subject{font-size:clamp(21px,2.2vw,29px);font-weight:750;line-height:1.2;margin-bottom:8px}
.task-prompt{color:var(--muted);max-width:78ch}
.work-card dl{margin:14px 0;border-top:1px solid var(--line);padding-top:10px}
.work-card dt{font-weight:720;color:var(--teal)}
.work-card dd{overflow-wrap:anywhere;white-space:pre-wrap;margin:3px 0 12px}
@media(max-width:760px){.work-report{grid-template-columns:1fr}}
.inline-model{margin:.65em 0 1em;padding:14px 18px;border-left:4px solid var(--teal);border-radius:6px;background:#e0f3eb;color:#163b35;font-size:clamp(18px,1.6vw,24px);line-height:1.45}
.work-card [data-model][aria-expanded="true"]{background:#e0f3eb}
.source-text,.inline-model,.key-view .quote{white-space:pre-line}.source-text{max-width:84ch}

#team-stage .stack textarea{width:min(100%,38ch);height:2.25em;min-height:2.25em;max-height:12em;padding:5px 8px;line-height:1.4;resize:vertical;overflow:auto}
.source-prompt{margin:4px 0}.source-prompt summary{font-size:.9rem;padding:2px 0}
</style>
</head>

function renderInstruments(){
 const target=document.querySelector('#instrument-results');
 const required=Object.keys(board.features).filter(key=>board.features[key]);
 const cases=instruments.slice(0,board.extra?4:3);
 const completed=cases.every(item=>Object.hasOwn(board.predictions,item.id));
 const run=document.querySelector('#run');
 run.disabled=!required.length||!completed||board.checked;
 document.querySelector('#extra').disabled=board.extra;
 let ruleErrors=0;
 let predictionErrors=0;
 const yesNo=value=>value?'Да':'Не';
 const rows=cases.map(item=>{
  const result=required.every(key=>item[key]);
  const matchesTarget=item.expected===result;
  const prediction=board.predictions[item.id];
  const matchesPrediction=prediction===result;
  if(!matchesTarget)ruleErrors++;
  if(!matchesPrediction)predictionErrors++;
  const picker=board.checked?yesNo(prediction):
   `<div class="prediction" role="group" aria-label="Прогноза за ${item.name}">${[true,false].map(value=>`<button type="button" data-item="${item.id}" data-value="${value}" aria-pressed="${prediction===value}">${yesNo(value)}</button>`).join('')}</div>`;
  const status=matchesTarget?'Правилото класифицира вярно':result?'Правилото включва погрешно':'Правилото пропуска';
  return `<tr class="${board.checked?(matchesTarget?'match':'mismatch'):''}"><th scope="row"><span class="instrument"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[item.id]}</svg>${item.name}</span></th><td>${picker}</td><td>${board.checked?yesNo(result):'—'}</td><td>${board.checked?yesNo(item.expected):'—'}</td><td>${board.checked?status:'—'}</td></tr>`;
 }).join('');
 const feedback=board.checked
  ? `Прогнози, които съвпаднаха с резултата: ${cases.length-predictionErrors} от ${cases.length}. Разминавания с правилната класификация: ${ruleErrors}.`
  : !required.length?'Изберете поне един признак.':completed?'Прогнозите са записани. Стартирайте проверката.':'За всеки уред прогнозирайте дали правилото ще го включи.';
 target.innerHTML=`<div class="table-wrap"><table><thead><tr><th scope="col">Уред</th><th scope="col">Прогноза на класа</th><th scope="col">Включва ли го правилото?</th><th scope="col">Термометър ли е?</th><th scope="col">Извод</th></tr></thead><tbody>${rows}</tbody></table></div><p class="feedback" role="status" tabindex="-1">${feedback}</p>${board.checked?'<p class="muted small">Кой ред е контрапример за правилото? Променете признак или разкрийте новия уред.</p>':''}`;
 target.querySelectorAll('[data-item]').forEach(button=>button.onclick=()=>{
  const {item,value}=button.dataset;
  board.predictions[item]=value==='true';
  renderInstruments();
  target.querySelector(`[data-item="${item}"][data-value="${value}"]`).focus();
 });
}

function readSavedKey(){
 try{
  const items=JSON.parse(recall(savedKeyName));
  if(Array.isArray(items)&&items.length&&items.every(row=>Array.isArray(row)&&row.length===2&&row.every(v=>typeof v==='string')))return {items};
 }catch{}
 return null;
}
let unlockedKey=readSavedKey();
window.addEventListener('storage',event=>{
 if(event.key!==savedKeyName&&event.key!==null)return;
 unlockedKey=readSavedKey();
 if(location.hash==='#teacher')teacherView();
});
const caseKeyTitles=['Слонът е голям бозайник','Логиката е наука за логичното','Растенията не са животни','Лъвът е царят на животните','Престолонаследник'];
function answerKey(area){

 area.innerHTML='<details><summary>Учителски ключ за обсъждане</summary><form><label>Личен учителски код <input type="password" autocomplete="off" required></label> <button class="btn">Отключи</button></form><p role="status"></p><div class="key-view" hidden><label>Задача <select></select></label> <button class="btn" data-show>Покажи отговора</button> <button class="btn alt" data-hide>Скрий</button> <button class="btn alt" data-lock>Заключи на този браузър</button><p class="quote" tabindex="-1" hidden></p></div></details>';
 const form=area.querySelector('form'),view=area.querySelector('.key-view'),status=area.querySelector('[role=status]'),details=area.querySelector('details');
 const select=view.querySelector('select'),answer=view.querySelector('.quote');
 let active=null;
 function hide(){
  if(active){
   details.insertBefore(form,view);details.insertBefore(status,view);
   active.nextElementSibling.replaceChildren();active.nextElementSibling.hidden=true;
   active.setAttribute('aria-expanded','false');active.textContent='Покажи отговора от оригинала';active=null;
  }
  answer.textContent='';answer.hidden=true;status.textContent='';
 }
 function show(){hide();answer.textContent=unlockedKey.items[select.selectedIndex][1];answer.hidden=false;answer.focus();}
 function reveal(){
  if(!active)return;
  const target=active.nextElementSibling;
  const item=unlockedKey.items.find(([label])=>label===active.dataset.model);
  details.insertBefore(form,view);details.insertBefore(status,view);
  target.textContent=item?item[1]:'Няма примерен отговор за тази задача.';
 }
 function choose(button){
  const closing=active===button;hide();if(closing)return;
  active=button;active.setAttribute('aria-expanded','true');active.textContent='Скрий отговора от оригинала';
  const target=active.nextElementSibling;target.hidden=false;
  if(view.hidden){target.append(form,status);form.querySelector('input').focus();}else reveal();
 }
 function ready(){
  form.hidden=true;view.hidden=false;status.textContent='';
  for(const [title] of unlockedKey.items)select.add(new Option(title));
  reveal();
 }
 if(unlockedKey)ready();
 else if(recall(previousKeyName)){
  sourceAnswers(JSON.parse(recall(previousKeyName))).then(items=>{
   if(!area.isConnected||!recall(previousKeyName)||unlockedKey)return;
   unlockedKey={items};remember(savedKeyName,JSON.stringify(items));remember(previousKeyName,'');ready();
  }).catch(()=>{status.textContent='Въведете учителския код за достъп до оригиналните отговори.';});
 }
 form.onsubmit=async event=>{
  event.preventDefault();const input=form.querySelector('input'),button=form.querySelector('button');
  const password=input.value;input.value='';button.disabled=true;
  try{const authorized=await classroom('/key',{...teacherRoom,pin:password});const items=await sourceAnswers(authorized.items);
   if(!area.isConnected||(!details.open&&!active?.isConnected))return;
   unlockedKey={items};remember(savedKeyName,JSON.stringify(items));ready();
  }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
 };
 select.onchange=hide;view.querySelector('[data-show]').onclick=show;
 view.querySelector('[data-hide]').onclick=hide;
 view.querySelector('[data-lock]').onclick=()=>{hide();unlockedKey=null;remember(savedKeyName,'');remember(previousKeyName,'');select.replaceChildren();form.hidden=false;view.hidden=true;details.open=false;};
 details.ontoggle=()=>{if(!details.open&&!active)hide();};
 return {choose,hide};
}

 panel.querySelector('#invite').onclick=async()=>{
  const note=panel.querySelector('#invite-note');
  try{await navigator.clipboard.writeText(inviteURL);note.textContent='Линкът е копиран. Отваря направо избора на екип.';}
  catch{note.textContent='Копирайте адреса: ';const input=document.createElement('input');input.readOnly=true;input.value=inviteURL;note.append(input);input.select();}
 };
 const list=panel.querySelector('#room-teams'),projection=panel.querySelector('#projection');
 let rendered='';
 function display(){
  const signature=JSON.stringify([selectedTeam,answers[selectedTeam]]);
  if(signature===rendered)return;
  rendered=signature;key?.hide();projection.replaceChildren();
  const answer=answers[selectedTeam];if(!answer)return;
  const team=content.teams[selectedTeam-1];
  projection.innerHTML=`<h3>Решение на екип ${selectedTeam} · ${esc(team.name)}</h3>${exerciseReport(selectedTeam-1,answer,Boolean(key))}<button class="btn alt" id="hide-work">Скрий решението на екипа</button>`;
  projection.querySelectorAll('[data-model]').forEach(button=>button.onclick=()=>key.choose(button));
  projection.querySelector('#hide-work').onclick=()=>{key?.hide();selectedTeam=0;display();};
 }
 const buttons=content.teams.map((_,i)=>{
  const button=document.createElement('button');button.textContent='Екип '+(i+1)+' · изчаква';button.disabled=true;
  list.append(button);button.onclick=()=>{key?.hide();selectedTeam=i+1;display();};return button;
 });
 let last='';
 async function refresh(){
  if(!panel.isConnected)return;
  try{
   const result=await classroom('/status',teacherRoom);
   if(!panel.isConnected)return;
   answers=result.teams;
   const count=Object.keys(answers).length;
   panel.querySelector('#room-status').textContent='Влезли екипи: '+result.joined.length+' от 5 · Предадени решения: '+count+' от 5';
   const signature=JSON.stringify([answers,result.joined,result.counts]);
   if(last!==signature){remember(cacheKey,JSON.stringify(answers));buttons.forEach((button,i)=>{button.disabled=!answers[i+1];button.dataset.status=answers[i+1]?'done':result.joined.includes(i+1)?'active':'waiting';button.textContent='Екип '+(i+1)+' · '+content.teams[i].name+(result.counts?' · '+(result.counts[i+1]||0)+'/5':'')+' · '+(answers[i+1]?'Покажи решението':result.joined.includes(i+1)?'Работи':'Очаква се');});display();last=signature;}
  }catch(error){if(panel.isConnected)panel.querySelector('#room-status').textContent=error.message+(Object.keys(answers).length?' Запазените решения можете да изтеглите от „Управление на часа“.':'');if(error.status===404||error.status===403){if(panel.isConnected)panel.querySelector('#new-room').closest('details').open=true;return;}}
  if(panel.isConnected)pollTimer=setTimeout(refresh,4000);
 }
 panel.querySelector('#new-room').onclick=()=>{if(!confirm('Да отворите ли нов час с нов код? Изтеглете нужните решения преди това.'))return;teacherRoom=null;selectedTeam=0;remember('definition.teacher','');teacherView();};
 panel.querySelector('#export-room').onclick=()=>{
  const notes=Object.entries(answers).map(([id,answer])=>reportText(Number(id)-1,answer)).join('\n\n');
  if(!notes){panel.querySelector('#room-status').textContent='Все още няма предадени решения.';return;}
  const url=URL.createObjectURL(new Blob([notes],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Resheniya_'+teacherRoom.code+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 refresh();
}

function route(){
 clearTimeout(pollTimer);
 const hash=location.hash.slice(1)||'teams';const team=/^team-([1-5])$/.exec(hash);
 const invitation=/^join-([0-9]{6})$/.exec(hash);
 const current=team||invitation?'teams':hash==='quiz-board'?'quiz':['board','teams','quiz','teacher','sources'].includes(hash)?hash:'start';
 app.classList.toggle('team-shell',Boolean(team));
 if(team)app.dataset.team=team[1];
 else delete app.dataset.team;
 document.querySelectorAll('nav a').forEach(link=>{if(link.hash==='#'+current)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});
 if(invitation)teams(0,invitation[1]);else if(team){const n=Number(team[1]);if(membership?.team===n&&membership.code===lessonCode)teamView(n-1);else teams(n);}else if(current==='sources')sourceView();else if(current==='teacher')teacherView();else if(current==='board')boardView();else if(current==='teams')teams();else if(current==='quiz')quiz(hash==='quiz-board');else home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
</body>
