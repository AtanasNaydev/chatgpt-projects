# Render Blueprint: creates a free web service + free 30-day PostgreSQL DB.
# Connect a GitHub repository and select New > Blueprint in Render.
services:
  - type: web
    name: misiya-404-classroom
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: MISSION404_CLOUD_MODE
        value: '1'
      - key: PYTHON_VERSION
        value: '3.12.8'
      - key: MISSION404_TEACHER_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: misiya-404-data
          property: connectionString
databases:
  - name: misiya-404-data
    region: frankfurt
    plan: free
    databaseName: mission404
    user: mission404
